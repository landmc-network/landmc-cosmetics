# Dependency versions for landmc-vanish.
#
# Only what this project adds on top of the platform. Okaeri, LiteCommands, Multification and
# Adventure arrive transitively with the platform modules, so their versions are decided in one
# place: landmc-platform's own catalog.
[versions]

# Must match the version published by landmc-platform.
landmc-platform = "1.2.0"

# Both servers publish Java 25 bytecode, which is why the plugin modules compile with
# --release 25.
paper = "26.2.build.121-stable"
velocity = "4.1.1"

shadow = "9.6.1"

junit = "6.1.3"
slf4j = "2.0.17"

[libraries]
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper" }
velocity-api = { module = "com.velocitypowered:velocity-api", version.ref = "velocity" }

platform-api = { module = "pl.landmc:platform-api", version.ref = "landmc-platform" }
platform-common = { module = "pl.landmc:platform-common", version.ref = "landmc-platform" }
platform-config = { module = "pl.landmc:platform-config", version.ref = "landmc-platform" }
platform-messaging = { module = "pl.landmc:platform-messaging", version.ref = "landmc-platform" }
platform-paper = { module = "pl.landmc:platform-paper", version.ref = "landmc-platform" }
platform-proxy = { module = "pl.landmc:platform-proxy", version.ref = "landmc-platform" }

junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-jupiter-params = { module = "org.junit.jupiter:junit-jupiter-params" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }

[plugins]
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
